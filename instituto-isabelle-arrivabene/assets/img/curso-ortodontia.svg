<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Ortodontia e Ortopedia Facial — fotografia a definir">
  <title>Ortodontia e Ortopedia Facial — fotografia a definir</title>
  <desc>Placeholder autoral. Fotografia real deve mostrar: Aparelho, modelo ou documentação ortodôntica</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2C2419"/>
      <stop offset="1" stop-color="#1A150F"/>
    </linearGradient>
    <radialGradient id="brasa" cx="0.62" cy="1" r="0.75">
      <stop offset="0" stop-color="#B29A6E" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#B29A6E" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#B29A6E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aresta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B29A6E" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#C9B48E" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#E6DCC8" stop-opacity="0.95"/>
      <stop offset="0.8" stop-color="#C9B48E" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#B29A6E" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#g)"/>
  <rect width="1200" height="800" fill="url(#brasa)"/>

  <!-- Os arcos de estratificação: dentina, esmalte, halo incisal -->
  <g fill="none" stroke="#B29A6E" stroke-linecap="round">
    <path d="M104.0 688.0 a 496.0 496.0 0 0 1 992.0 0" stroke-opacity="0.30" stroke-width="3.36"/>
    <path d="M264.0 688.0 a 336.0 336.0 0 0 1 672.0 0" stroke-opacity="0.22" stroke-width="3.36"/>
    <path d="M424.0 688.0 a 176.0 176.0 0 0 1 352.0 0" stroke-opacity="0.16" stroke-width="3.36"/>
  </g>

  <!-- A aresta incisal -->
  <rect x="0" y="0" width="1200" height="4.0" fill="url(#aresta)"/>

  <text x="600" y="400.0" text-anchor="middle" fill="#E6DCC8"
        font-family="Georgia, 'Times New Roman', serif" font-size="50" font-style="italic">Ortodontia e Ortopedia Facial</text>
  <text x="600" y="477.5" text-anchor="middle" fill="#B29A6E"
        font-family="Helvetica, Arial, sans-serif" font-size="21" letter-spacing="3.78"
        font-weight="600">FOTOGRAFIA A DEFINIR</text>
</svg>
