<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Auditório — fotografia a definir">
  <title>Auditório — fotografia a definir</title>
  <desc>Placeholder autoral. Fotografia real deve mostrar: Auditório vazio, do fundo, iluminação acesa</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2C2419"/>
      <stop offset="1" stop-color="#1A150F"/>
    </linearGradient>
    <radialGradient id="brasa" cx="0.62" cy="1" r="0.75">
      <stop offset="0" stop-color="#B29A6E" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#B29A6E" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#B29A6E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aresta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B29A6E" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#C9B48E" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#E6DCC8" stop-opacity="0.95"/>
      <stop offset="0.8" stop-color="#C9B48E" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#B29A6E" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#g)"/>
  <rect width="1200" height="675" fill="url(#brasa)"/>

  <!-- Os arcos de estratificação: dentina, esmalte, halo incisal -->
  <g fill="none" stroke="#B29A6E" stroke-linecap="round">
    <path d="M181.5 580.5 a 418.5 418.5 0 0 1 837.0 0" stroke-opacity="0.30" stroke-width="2.83"/>
    <path d="M316.5 580.5 a 283.5 283.5 0 0 1 567.0 0" stroke-opacity="0.22" stroke-width="2.83"/>
    <path d="M451.5 580.5 a 148.5 148.5 0 0 1 297.0 0" stroke-opacity="0.16" stroke-width="2.83"/>
  </g>

  <!-- A aresta incisal -->
  <rect x="0" y="0" width="1200" height="3.4" fill="url(#aresta)"/>

  <text x="600" y="337.5" text-anchor="middle" fill="#E6DCC8"
        font-family="Georgia, 'Times New Roman', serif" font-size="42" font-style="italic">Auditório</text>
  <text x="600" y="402.6" text-anchor="middle" fill="#B29A6E"
        font-family="Helvetica, Arial, sans-serif" font-size="18" letter-spacing="3.24"
        font-weight="600">FOTOGRAFIA A DEFINIR</text>
</svg>
