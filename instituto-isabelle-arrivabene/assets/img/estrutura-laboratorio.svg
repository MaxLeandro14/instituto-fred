<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" role="img" aria-label="Laboratório — fotografia a definir">
  <title>Laboratório — fotografia a definir</title>
  <desc>Placeholder autoral. Fotografia real deve mostrar: Bancada de laboratório, instrumental em ordem</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2C2419"/>
      <stop offset="1" stop-color="#1A150F"/>
    </linearGradient>
    <radialGradient id="brasa" cx="0.62" cy="1" r="0.75">
      <stop offset="0" stop-color="#B29A6E" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#B29A6E" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#B29A6E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aresta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B29A6E" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#C9B48E" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#E6DCC8" stop-opacity="0.95"/>
      <stop offset="0.8" stop-color="#C9B48E" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#B29A6E" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="750" fill="url(#g)"/>
  <rect width="1000" height="750" fill="url(#brasa)"/>

  <!-- Os arcos de estratificação: dentina, esmalte, halo incisal -->
  <g fill="none" stroke="#B29A6E" stroke-linecap="round">
    <path d="M35.0 645.0 a 465.0 465.0 0 0 1 930.0 0" stroke-opacity="0.30" stroke-width="3.15"/>
    <path d="M185.0 645.0 a 315.0 315.0 0 0 1 630.0 0" stroke-opacity="0.22" stroke-width="3.15"/>
    <path d="M335.0 645.0 a 165.0 165.0 0 0 1 330.0 0" stroke-opacity="0.16" stroke-width="3.15"/>
  </g>

  <!-- A aresta incisal -->
  <rect x="0" y="0" width="1000" height="3.8" fill="url(#aresta)"/>

  <text x="500" y="375.0" text-anchor="middle" fill="#E6DCC8"
        font-family="Georgia, 'Times New Roman', serif" font-size="46" font-style="italic">Laboratório</text>
  <text x="500" y="446.3" text-anchor="middle" fill="#B29A6E"
        font-family="Helvetica, Arial, sans-serif" font-size="20" letter-spacing="3.6"
        font-weight="600">FOTOGRAFIA A DEFINIR</text>
</svg>
