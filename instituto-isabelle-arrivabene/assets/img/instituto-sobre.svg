<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" width="900" height="1125" role="img" aria-label="O Instituto — fotografia a definir">
  <title>O Instituto — fotografia a definir</title>
  <desc>Placeholder autoral. Fotografia real deve mostrar: Fachada ou recepção no Champs Mall, luz natural</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2C2419"/>
      <stop offset="1" stop-color="#1A150F"/>
    </linearGradient>
    <radialGradient id="brasa" cx="0.62" cy="1" r="0.75">
      <stop offset="0" stop-color="#B29A6E" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#B29A6E" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#B29A6E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aresta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B29A6E" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#C9B48E" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#E6DCC8" stop-opacity="0.95"/>
      <stop offset="0.8" stop-color="#C9B48E" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#B29A6E" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1125" fill="url(#g)"/>
  <rect width="900" height="1125" fill="url(#brasa)"/>

  <!-- Os arcos de estratificação: dentina, esmalte, halo incisal -->
  <g fill="none" stroke="#B29A6E" stroke-linecap="round">
    <path d="M-108.0 967.5 a 558.0 558.0 0 0 1 1116.0 0" stroke-opacity="0.30" stroke-width="3.78"/>
    <path d="M72.0 967.5 a 378.0 378.0 0 0 1 756.0 0" stroke-opacity="0.22" stroke-width="3.78"/>
    <path d="M252.0 967.5 a 198.0 198.0 0 0 1 396.0 0" stroke-opacity="0.16" stroke-width="3.78"/>
  </g>

  <!-- A aresta incisal -->
  <rect x="0" y="0" width="900" height="4.5" fill="url(#aresta)"/>

  <text x="450" y="562.5" text-anchor="middle" fill="#E6DCC8"
        font-family="Georgia, 'Times New Roman', serif" font-size="56" font-style="italic">O Instituto</text>
  <text x="450" y="649.3" text-anchor="middle" fill="#B29A6E"
        font-family="Helvetica, Arial, sans-serif" font-size="23" letter-spacing="4.14"
        font-weight="600">FOTOGRAFIA A DEFINIR</text>
</svg>
