  <title id="t">Instituto Isabelle Arrivabene</title>
  <desc>Instituto Isabelle Arrivabene: redesenho vetorial (2026-11-24) a partir da logo enviada pelo cliente. Simbolo tracado a mao em Bezier. Nome em Bellefair e "INSTITUTO" em Raleway, ambas SIL OFL, convertidas em curvas; o "A" com travessao ondulado foi redesenhado. Se existir o vetor oficial, ele prevalece.</desc>
